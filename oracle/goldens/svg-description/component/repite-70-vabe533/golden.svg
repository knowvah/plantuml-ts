 L556.64,176 L829.352,176 L829.352,150 L819.352,140 L556.64,140" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M819.352,140 L819.352,150 L829.352,150 L819.352,140" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="562.64" y="155.111" fill="#000" font-size="13" textLength="251.712">2Measure the temperature and outputs it as</text><text x="562.64" y="168.111" fill="#000" font-size="13" textLength="172.656">raw, unfiltered value in Kelvin.</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="36"><path d="M569.39,441 L569.39,503 L828.615,503 L828.615,451 L818.615,441 L569.39,441" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M818.615,441 L818.615,451 L828.615,451 L818.615,441" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="575.39" y="456.111" fill="#000" font-size="13" textLength="238.225">4Takes the given raw temperature values</text><text x="575.39" y="469.111" fill="#000" font-size="13" textLength="214.5">in Kelvin, puts a moving average with</text><text x="575.39" y="482.111" fill="#000" font-size="13" textLength="228.962">configurable window size on it, converts</text><text x="575.39" y="495.111" fill="#000" font-size="13" textLength="199.794">it to degree and outputs that value.</text></g><g class="entity" data-qualified-name="GMN25" id="ent0026" data-source-line="65"><path d="M235.85,772 L235.85,847 L492.15,847 L492.15,782 L482.15,772 L235.85,772" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M482.15,772 L482.15,782 L492.15,782 L482.15,772" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="241.85" y="787.111" fill="#000" font-size="13" textLength="181.756">6Gets as input a temperature in</text><text x="241.85" y="800.111" fill="#000" font-size="13" textLength="218.725">degree Celsius or Fahrenheit, or both.</text><text x="241.85" y="813.111" fill="#000" font-size="13" textLength="196.381">Displays both temperature values.</tex