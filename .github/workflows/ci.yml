name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # `@knowvah/theme` installs from GitHub Packages; see .npmrc.
  packages: read

# A newer push supersedes an in-flight PR run; main runs are never cancelled,
# because main's result is the record of whether that commit was green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ----------------------------------------------------------------------------
# Shape (2026-10-12): the single `gates` job measured 12.9 min in run
# 38313948530, 9.4 min of it `npm test` on a 4-vCPU runner, with typecheck /
# lint / format / build sequential ahead of it. The suite is now split into
# TEST_SHARDS vitest shards (vitest splits test FILES, not cases) that run in
# parallel with the static gates; a `merge` job combines the shards' blob
# reports, and that is the ONE place the 90/90/90 coverage thresholds and the
# collected-file-count guard are enforced. Each shard keeps a short, linear
# log; `npm test` locally is unchanged.
#
# Per-shard coverage is collected (`--coverage`, the blob carries it) but its
# thresholds are zeroed: a quarter of the files cannot meet a whole-suite
# threshold, and vitest otherwise fails every shard on the numbers the merge
# is about to recompute (measured: shard 1/16 alone reads 46% lines).
# ----------------------------------------------------------------------------

env:
  TEST_SHARDS: 4

jobs:
  # --------------------------------------------------------------------------
  # Cheap gates first: typecheck / lint / format / build need no vendored
  # stdlib, so a type error or a lint failure costs ~1 min; the stdlib is
  # restored only afterwards, for the size-deltas ratchet. Runs alongside the
  # test shards instead of ahead of them.
  # --------------------------------------------------------------------------
  static:
    name: static gates
    runs-on: ubuntu-latest
    # Observed 2.3 min for these steps in run 38313948530.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Reads the `volta.node` pin from package.json, the same source volta
          # uses locally, so CI and the dev box cannot drift apart.
          node-version-file: package.json
          cache: npm
          # Writes the npm.pkg.github.com auth line to the runner's ~/.npmrc
          # so `@knowvah/theme` resolves; the scope mapping itself is in
          # the repo's .npmrc.
          registry-url: https://npm.pkg.github.com
          scope: '@knowvah'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      # lint-staged formats only staged files; this keeps untouched files
      # from drifting out of prettier style again.
      - name: format
        run: npm run format:check

      - name: build
        run: npm run build

      # Shrink-only conformance ratchet, separate from vitest. Exits 2 if any
      # fixture widened; reads only committed goldens, so it needs no oracle
      # jar and no local cache — but it DOES render every golden through
      # `renderSync` with the stdlib assets wired (`scripts/stdlib-assets-store
      # .ts:98` throws without `assets/stdlib`; PR #76's first run), so the
      # vendored tree is restored here first. Cache hit: seconds.
      #
      # jiti, not tsx: tsx is not a dependency of this repo, so `npx tsx` would
      # silently fetch an unpinned version on every run. jiti is a pinned
      # devDependency and is already what `npm run build:stdlib` uses.
      - uses: ./.github/actions/vendored-stdlib

      - name: description size deltas
        run: npx jiti scripts/measure-description-size-deltas.ts

  # --------------------------------------------------------------------------
  # The suite, in TEST_SHARDS parallel shards. Includes the oracle gates (the
  # svg goldens, the ratchets) — all enforced inside vitest. Each shard needs
  # the vendored stdlib: vitest's globalSetup builds every stdlib package from
  # it before any worker starts.
  # --------------------------------------------------------------------------
  test:
    name: test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Hard backstop for a hang, not a performance budget. A quarter of the
    # 9.4-min single-runner suite plus ~1.5 min of setup; 15 leaves ~3x.
    timeout-minutes: 15
    strategy:
      # One red shard must not cancel the others: the merge job reads every
      # blob, so a partial run still reports which files failed.
      fail-fast: false
      matrix:
        # Keep in step with env.TEST_SHARDS (a matrix cannot read `env`).
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@knowvah'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/vendored-stdlib

      # `--shard=i/n` takes a deterministic 1/n of the collected files; the
      # blob reporter stores results AND the raw coverage for `--merge-reports`
      # (the shard's own coverage report is kept to the cheap json-summary; the
      # merge job renders the real reporters). Thresholds zeroed — see the
      # header comment.
      - name: vitest shard
        run: >-
          npx vitest run
          --shard=${{ matrix.shard }}/${{ env.TEST_SHARDS }}
          --reporter=blob
          --outputFile.blob=.vitest/blob/blob-${{ matrix.shard }}.json
          --coverage
          --coverage.reporter=json-summary
          --coverage.thresholds.lines=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.branches=0

      # The blob is the shard's only product. Uploaded even when tests failed
      # (`!cancelled()`), so the merge still prints the failures with the rest.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # --------------------------------------------------------------------------
  # One report, one verdict. Merges the shards' blobs, renders the configured
  # coverage reporters into coverage/, enforces the 90/90/90 thresholds, and
  # checks that the shards together collected exactly the files on disk.
  # `--merge-reports` runs no tests and no globalSetup (verified locally
  # without assets/stdlib present), so it needs neither the stdlib nor the
  # cache.
  # --------------------------------------------------------------------------
  merge:
    name: merge reports
    needs: [test]
    # Runs after red shards too: the merged log is where a failure is read,
    # and D2 below wants the coverage report published even when thresholds
    # fail. `!cancelled()` (not `always()`) still skips a hard timeout/cancel.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      # `gh api .../actions/runs/<id>` for the workflow's start time (the soft
      # budget below); a job cannot otherwise see when the workflow began.
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@knowvah'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true

      # Config reporters (text, html, clover, json, cobertura) and the
      # thresholds come from vitest.config.ts, exactly as `npm test` does; the
      # json reporter feeds the file-count guard below.
      - name: merge shards, render coverage, enforce thresholds
        run: >-
          npx vitest run
          --merge-reports=.vitest/blob
          --reporter=default
          --reporter=json
          --outputFile.json=.vitest/merged.json
          --coverage

      # A vitest run can collect fewer files than are on disk and still exit 0
      # (.agent-notes/coverage-tmp-race.md; a filter can collect nothing). The
      # shards must add up to every `tests/**/*.test.ts` outside tests/e2e/,
      # the config's own include/exclude.
      - name: collected files equal files on disk
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          collected=$(node -p "JSON.parse(require('fs').readFileSync('.vitest/merged.json','utf8')).testResults.length")
          on_disk=$(find tests -name '*.test.ts' -not -path 'tests/e2e/*' | wc -l | tr -d ' ')
          echo "collected ${collected} test files across ${TEST_SHARDS} shards; ${on_disk} on disk"
          if [ "$collected" != "$on_disk" ]; then
            echo "::error title=Test files skipped::${collected} collected but ${on_disk} on disk -- a shard ran short; read its log before re-running."
            exit 1
          fi

      # D2: publish the report even if the coverage thresholds above failed
      # the step -- otherwise a repo that starts below 90/90/90 could never
      # get a Code Quality baseline. `!cancelled()` (not `always()`) still
      # skips this on a hard timeout/cancel, where no report was written.
      # Same-repo guard: a fork PR's `GITHUB_TOKEN` cannot carry
      # `code-quality: write`, so its artifact would have no consumer.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          name: coverage
          path: coverage/cobertura-coverage.xml
          if-no-files-found: error
          retention-days: 7

      # ----------------------------------------------------------------------
      # Soft performance budget, now end-to-end for the whole workflow (this
      # job is the last on the critical path). A hard timeout only fires once
      # things are already broken; this reports every run's wall clock and
      # warns while a slowdown is still a trend rather than a failure. Never
      # fails the build — a slow green build is still green, and a gate that
      # cries wolf on runner variance gets ignored.
      #
      # Budget 8 min is a PROJECTION from the sharded shape (four ~2.5-min
      # shards plus ~1.5 min setup each, in parallel with the 2.3-min static
      # job, then this merge) against the 12.9-min single-job run 38313948530;
      # the previous budget was 12 from one 8.3-min sample. Re-derive from the
      # slow end once a few sharded runs exist.
      # ----------------------------------------------------------------------
      - name: flag a slow run
        if: always()
        env:
          BUDGET_MIN: 8
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at)
          start_s=$(date -d "$started" +%s)
          elapsed=$(( $(date +%s) - start_s ))
          mins=$(awk "BEGIN {printf \"%.1f\", $elapsed/60}")
          echo "CI wall clock: **${mins} min** (budget ${BUDGET_MIN} min, projected from the sharded shape; pre-shard single job 12.9)" \
            >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt $(( BUDGET_MIN * 60 )) ]; then
            echo "::warning title=Slow CI run::${mins} min, over the ${BUDGET_MIN} min soft budget (projected; pre-shard 12.9). Check the shard timings before raising the budget — the usual causes are a growing suite, an unbalanced shard, or a cache that stopped hitting."
          fi

  # Publishes line coverage to GitHub Code Quality (PR comment + main baseline).
  # Own job so code-quality:write never reaches the jobs that run npm install
  # scripts. Fork PRs cannot get a write token and are skipped.
  # on-call: if upload-coverage 403s, enable Code Quality in repo Settings ->
  # Security -> Code quality, then re-run the failed job.
  upload-coverage:
    needs: [merge]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage

      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `@knowvah/theme` installs from GitHub Packages; see .npmrc.
      packages: read
    # Hard backstop for a hang, not a performance budget (code-review-tasks.md
    # item 7 — this job's first landing, so there is no `gh run list` history
    # yet to size it off, unlike `gates` above). `npm ci` + a cold Playwright
    # Chromium download dominate; the suite itself ran in 7.3s locally
    # (17 specs, `npx playwright test`). Revisit once a few real runs exist.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Reads the `volta.node` pin from package.json, the same source volta
          # uses locally, so CI and the dev box cannot drift apart.
          node-version-file: package.json
          cache: npm
          # Writes the npm.pkg.github.com auth line to the runner's ~/.npmrc
          # so `@knowvah/theme` resolves; the scope mapping itself is in
          # the repo's .npmrc.
          registry-url: https://npm.pkg.github.com
          scope: '@knowvah'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Playwright's own browser binaries, not an npm package — cached
      # separately from node_modules and installed with their OS-level
      # dependencies (`--with-deps`) since the runner has none preinstalled.
      - name: install playwright chromium
        run: npx playwright install --with-deps chromium

      - name: e2e tests
        run: npm run test:e2e
