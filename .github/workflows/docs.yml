# Builds `docs-site/` and publishes it to GitHub Pages at plantuml.knowvah.com
# (the host comes from docs-site/public/CNAME, which lands in the artifact).
#
# Separate from `ci.yml` on purpose. This runs on `main` only — a docs deploy
# has nothing to say about a pull request — and it owns the `pages`
# concurrency group, so two merges in quick succession queue rather than race
# each other to the same deployment.
#
# Modelled on `dot-atlassian/.github/workflows/docs.yml`, which publishes the
# sibling VitePress site in this org at confluence.knowvah.com, with pnpm
# swapped for this repo's npm.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write
  # `@knowvah/theme` installs from GitHub Packages; see .npmrc.
  packages: read

# Allow one concurrent deployment; skip runs queued behind a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Hard backstop for a hang, not a performance budget. Observed 41-46s
    # across runs 35602146976 and 35601599130 (`gh run view --json jobs`); 5
    # min is comfortably over an order of magnitude above that.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Reads the `volta.node` pin from package.json, the same source volta
          # uses locally, so CI and the dev box cannot drift apart.
          node-version-file: package.json
          # Writes the npm.pkg.github.com auth line to the runner's ~/.npmrc
          # so `@knowvah/theme` resolves; the scope mapping itself is in
          # the repo's .npmrc.
          registry-url: https://npm.pkg.github.com
          scope: '@knowvah'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run docs:build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs-site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Same rationale as `build` above: observed 9-41s across the same two
    # runs; 3 min is a hard backstop for a hang, not a performance budget.
    timeout-minutes: 3
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
