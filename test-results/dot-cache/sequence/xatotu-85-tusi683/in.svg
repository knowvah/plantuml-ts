7,51.319,111,61.319,115,57.319,111" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="55.319" y1="111" x2="437.319" y2="111" style="stroke:#181818;stroke-width:1;"/><text x="67.319" y="106.111" fill="#000" font-size="13" textLength="14.463">40</text><path d="M443.319,97 L443.319,198 L849.319,198 L849.319,107 L839.319,97 L443.319,97" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M839.319,97 L839.319,107 L849.319,107 L839.319,97" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="449.319" y="112.111" fill="#000" font-size="13" textLength="357.5">The card contains 4 groups: header, card id, informative information</text><text x="449.319" y="125.111" fill="#000" font-size="13" textLength="246.269">and specific content according to the card type.</text><text x="449.319" y="138.111" fill="#000" font-size="13" textLength="320.206">This profile can see an icon that allow user to create a new card</text><text x="449.319" y="151.111" fill="#000" font-size="13" textLength="215.719">starting from the current card as template</text><text x="449.319" y="164.111" fill="#000" font-size="13" textLength="289.006">and a second icon that allows him to enter the edit mode.</text><text x="449.319" y="177.111" fill="#000" font-size="13" textLength="281.125">Add to favorite and Languages actions are displayed.</text><text x="449.319" y="190.111" fill="#000" font-size="13" textLength="385.937">Rubric edit, Copy and Watch this page actions are displayed for this profile</text><polygon points="61.319,218,51.319,222,61.319,226,57.319,222" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="55.319" y1="222" x2="437.319" y2="222" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="67.319" y="217.111" fill="#000" font-size="13" textLength="364">60 The system displays card creation screen with correct parameters</text><?plantuml-src 