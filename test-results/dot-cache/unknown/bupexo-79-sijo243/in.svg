<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" style="width:503px;height:376px;background:#FFFFFF;" width="503px" height="376px" viewBox="0 0 503 376" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml $version$?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="502.05" height="92" fill="#EAE2C9" style="stroke:#EAE2C9;stroke-width:1;"/><text x="10" y="28.889" fill="#000" font-size="14" textLength="225.838" font-weight="700">Add your own dedication into PlantUML</text><text x="10" y="42.889" fill="#000" font-size="14"> </text><text x="10" y="56.889" fill="#000" font-size="14" textLength="121.275">For just $5 per month!</text><text x="10" y="70.889" fill="#000" font-size="14" textLength="58.45">Details on</text><a target="" href="https://plantuml.com/dedication" xlink:href="https://plantuml.com/dedication" xlink:type="simple" xlink:actuate="onRequest" xlink:show="new" title="https://plantuml.com/dedication" xlink:title="https://plantuml.com/dedication"><text x="68.45" y="70.889" fill="#000" font-size="14" textLength="192.763" font-style="italic">https://plantuml.com/dedication</text></a><image width="93" height="93" x="271.213" y="0" xlink:href="data:image/png;base64,"/><rect x="0" y="92" width="502.05" height="178" fill="#FFF" style="stroke:#FFF;stroke-width:1;"/><text x="5" y="106.333" fill="#000" font-size="12" textLength="116.025" font-weight="700">Welcome to PlantUML!</text><text x="5" y="118.333" fill="#000" font-size="12"> </text><text x="5" y="130.333" fill="#000" font-size="12" textLength="218.85">You can start with a simple UML Diagram like:</text><text x="5" y="142.333" fill="#000" font-size="12"> </text><text x="5" y="154.333" fill="#000" font-size="12" textLength="89.25" font-family="monospace">Bob->Alice: Hello</text><text x="5" y="166.333" fill="#000" font-size="12"> </text><text x="5" y="178.333" fill="#000" font-size="12" textLength="