ualified-name="GMN4" id="ent0005" data-source-line="17"><path d="M373.658,140 L373.658,176 L624.92,176 L624.92,150 L614.92,140 L373.658,140" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M614.92,140 L614.92,150 L624.92,150 L614.92,140" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="379.658" y="155.111" fill="#000" font-size="13" textLength="230.263">2 Measure the temperature and outputs it as</text><text x="379.658" y="168.111" fill="#000" font-size="13" textLength="158.356">raw, unfiltered value in Kelvin.</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="36"><path d="M385.618,441 L385.618,503 L626.968,503 L626.968,451 L616.968,441 L385.618,441" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M616.968,441 L616.968,451 L626.968,451 L616.968,441" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="391.618" y="456.111" fill="#000" font-size="13" textLength="220.35">4 Takes the given raw temperature values</text><text x="391.618" y="469.111" fill="#000" font-size="13" textLength="193.05">in Kelvin, puts a moving average with</text><text x="391.618" y="482.111" fill="#000" font-size="13" textLength="211.088">configurable window size on it, converts</text><text x="391.618" y="495.111" fill="#000" font-size="13" textLength="178.344">it to degree and outputs that value.</text></g><g class="entity" data-qualified-name="GMN25" id="ent0026" data-source-line="65"><path d="M587.078,831.5 L587.078,906.5 L825.503,906.5 L825.503,841.5 L815.503,831.5 L587.078,831.5" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M815.503,831.5 L815.503,841.5 L825.503,841.5 L815.503,831.5" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="593.078" y="846.611" fill="#000" font-size="13" textLength="163.881">6 Gets as input a temperature in</text><text x="593.078" y="859.611" fill="#000" font-size="13" textLength="200.85">degree Celsius or Fahrenheit, or both.</text>