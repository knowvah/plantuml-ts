 fill="#FEFFDD"/><path d="M788.68,441 L788.68,451 L798.68,451 L788.68,441" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="563.33" y="456.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="220.35" font-family="sans-serif">4Takes the given raw temperature values</text><text x="563.33" y="469.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="193.05" font-family="sans-serif">in Kelvin, puts a moving average with</text><text x="563.33" y="482.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="211.0875" font-family="sans-serif">configurable window size on it, converts</text><text x="563.33" y="495.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="178.3438" font-family="sans-serif">it to degree and outputs that value.</text></g><g class="entity" data-qualified-name="GMN25" id="ent0026" data-source-line="65"><path d="M244.79,772 L244.79,847 L483.215,847 L483.215,782 L473.215,772 L244.79,772" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M473.215,772 L473.215,782 L483.215,782 L473.215,772" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="250.79" y="787.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="163.8813" font-family="sans-serif">6Gets as input a temperature in</text><text x="250.79" y="800.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="200.85" font-family="sans-serif">degree Celsius or Fahrenheit, or both.</text><text x="250.79" y="813.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="185.6563" font-family="sans-serif">Displays both temperature values.</text><text x="250.79" y="826.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="217.425" font-family="sans-serif">Calls the tempConverter for conversion if</text><text x="250.79" y="839.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="162.7438" font-family="sans-serif">only one value is given as input.</text></g><!--link tempSensor to GMN4--><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk6" data-source-line="17" data-link-type="association"><path d="M529.7092,135.4457 C530.3798,135.5541 531.0496,135.6623 531.7187,135.7703 C534.3949,136.2022 537.0582,136.6304 539.7062,137.0546 C545.0022,137.903 550.2369,138.7356 555.39,139.55" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="tempSensor-GMN4"/></g><!--link tempProcessing to GMN11--><g class="link" data-entity-1="ent0007" data-entity-2="ent0012" id="lnk13" data-source-line="36" data-link-type="association"><path d="M541.5455,439.3694 C541.8936,439.4446 542.2426,439.5201 542.5926,439.5959 C543.2926,439.7476 543.9965,439.9007 544.7044,440.0553 C546.1202,440.3644 547.5519,440.6792 549,441 C551.69,441.6 554.42,442.2 557.17,442.82" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="tempProcessing-GMN11"/></g><!--reverse link display to temp_dC_displayTemp--><g class="link" data-entity-1="ent0019" data-entity-2="ent0015" id="lnk22" data-source-line="57" data-link-type="dependency"><path d="M240,658.87 C240,634.38 240,600.63 240,586.97" style="stroke:#181818;stroke-width:1;" fill="none" id="display-backto-temp_dC_displayTemp"/><polygon points="240,663.87,244,654.87,240,658.87,236,654.87,240,663.87" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link temp_dF_displayTemp to display--><g class="link" data-entity-1="ent0016" data-entity-2="ent0019" id="lnk23" data-source-line="58" data-link-type="dependency"><path d="M322.8,584.4 C313.8,588.13 297.03,596.04 286,607 C269.5,623.4 258.8075,642.3759 250.9475,659.2859" style="stroke:#181818;stroke-width:1;" fill="none" id="temp_dF_displayTemp-to-display"/><polygon points="248.84,663.82,256.2609,657.3446,250.9475,659.2859,249.0062,653.9725,248.84,663.82" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;st