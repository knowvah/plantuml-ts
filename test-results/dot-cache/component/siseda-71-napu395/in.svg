<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:594px;height:900px;background:#FFFFFF;" width="594px" height="900px" viewBox="0 0 594 900" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml $version$?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><path d="M6,196 L6,232 L278,232 L278,206 L268,196 L6,196" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M268,196 L268,206 L278,206 L268,196" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="211.111" fill="#000" font-size="13" textLength="251.713">2Measure the temperature and outputs it as</text><text x="12" y="224.111" fill="#000" font-size="13" textLength="172.656">raw, unfiltered value in Kelvin.</text><!--cluster tempSensor--><g class="cluster" data-qualified-name="tempSensor" id="ent0001" data-source-line="6"><rect x="47" y="7" width="186" height="146" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="213" y="12" width="15" height="10" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="211" y="14" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="211" y="18" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="115.85" y="30.889" fill="#000" font-size="14" textLength="48.3" font-style="italic">«block»</text><text x="75.863" y="44.889" fill="#000" font-size="14" textLength="128.275" font-weight="700">Temperature Sensor</text></g><path d="M60,506 L60,568 L319,568 L319,516 L309,506 L60,506" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M309,506 L309,516 L319,516 L309,506" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="66" y="521.111" fill="#000" font-size="13" textLength="238.225">4Takes the given raw temperature values</text><text x="66" y="534.111" fill="#000" font-size="13" textLength="214.5">in Kelvin, puts a moving average with</text><text x="66" y="547.111" fill="#000" font-size="13" textLength="228.963">configurable window size on it, converts</text><text x="66" y="560.111" fill="#000" font-size="13" textLength="199.794">it to degree and outputs that value.</text><!--cluster tempProcessing--><g class="cluster" data-qualified-name="tempProcessing" id="ent0004" data-source-line="24"><rect x="96" y="291" width="186" height="172" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="262" y="296" width="15" height="10" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="260" y="298" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="260" y="302" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="164.85" y="314.889" fill="#000" font-size="14" textLength="48.3" font-style="italic">«block»</text><text x="112.394" y="328.889" fill="#000" font-size="14" textLength="153.213" font-weight="700">Temperature Processing</text></g><path d="M220,810 L220,885 L476,885 L476,820 L466,810 L220,810" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M466,810 L466,820 L476,820 L466,810" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="226" y="825.111" fill="#000" font-size="13" textLength="181.756">6Gets as input a temperature in</text><text x="226" y="838.111" fill="#000" font-size="13" textLength="218.725">degree Celsius or Fahrenheit, or both.</text><text x="226" y="851.111" fill="#000" font-size="13" textLength="196.381">Displays both temperature values.</text><text x="226" y="864.111" fill="#000" font-size="13" textLength="235.3">Calls the tempConverter for conversion if</text><text x="226" y="877.111" fill="#000" font-size="13" textLength="184.194">only one value is given as input.</text><!--cluster displayTemp--><g class="cluster" data-qualified-name="displayTemp" id="ent0008" data-source-line="43"><rect x="116" y="627" width="464" height="166" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="560" y="632" width="15" height="10" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="558" y="634" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="558" y="638" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="323.85" y="650.889" fill="#000" font-size="14" textLength="48.3" font-style="italic">«block»</text><text x="308.275" y="664.889" fill="#000" font-size="14" textLength="79.45" font-weight="700">displayTemp</text></g><!--cluster internals--><g class="cluster" data-qualified-name="displayTemp.internals" id="ent0012" data-source-line="54"><rect x="132" y="700" width="243" height="77" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="227.031" y="712.889" fill="#000" font-size="14" textLength="52.938" font-weight="700">internals</text></g><g class="entity" data-qualified-name="tempSensor.tempSensor_TVs" id="ent0002" data-source-line="8"><path d="M55.12,46 L55.12,95 L224.889,95 L224.889,56 L214.889,46 L55.12,46" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M214.889,46 L214.889,56 L224.889,56 L214.889,46" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="61.12" y="61.111" fill="#000" font-size="13" textLength="148.769">1some tagged value table</text><text x="61.12" y="74.111" fill="#000" font-size="13" textLength="81.656">would be here</text><text x="61.12" y="87.111" fill="#000" font-size="13" textLength="44.119">usually.</text></g><g class="entity" data-qualified-name="tempSensor.tempSensor_temp_dK_raw" id="ent0003" data-source-line="13"><text x="78.364" y="169.889" fill="#000" font-size="14" textLength="86.363">temp_dK_raw</text><rect x="125.17" y="147" width="12" height="12" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/></g><g class="entity" data-qualified-name="tempProcessing.tempProcessing_TVs" id="ent0005" data-source-line="27"><path d="M1