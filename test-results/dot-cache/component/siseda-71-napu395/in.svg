<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:569px;height:900px;background:#FFFFFF;" width="569px" height="900px" viewBox="0 0 569 900" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml $version$?><defs/><g><path d="M6,196 L6,232 L257,232 L257,206 L247,196 L6,196" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M247,196 L247,206 L257,206 L247,196" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="211.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="230.2625" font-family="sans-serif">2Measure the temperature and outputs it as</text><text x="12" y="224.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="158.3563" font-family="sans-serif">raw, unfiltered value in Kelvin.</text><!--cluster tempSensor--><g class="cluster" data-qualified-name="tempSensor" id="ent0001" data-source-line="6"><rect x="42" y="7" width="176" height="146" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="198" y="12" width="15" height="10" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="196" y="14" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="196" y="18" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="105.85" y="30.8889" fill="#000000" font-size="14" lengthAdjust="spacing" textLength="48.3" font-style="italic" font-family="sans-serif">«block»</text><text x="67.7875" y="44.8889" fill="#000000" font-size="14" lengthAdjust="spacing" textLength="124.425" font-weight="700" font-family="sans-serif">Temperature Sensor</text></g><path d="M55,506 L55,568 L296,568 L296,516 L286,506 L55,506" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M286,506 L286,516 L296,516 L286,506" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="61" y="521.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="220.35" font-family="sans-serif">4Takes the given raw temperature values</text><text x="61" y="534.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="193.05" font-family="sans-serif">in Kelvin, puts a moving average with</text><text x="61" y="547.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="211.0875" font-family="sans-serif">configurable window size on it, converts</text><text x="61" y="560.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="178.3438" font-family="sans-serif">it to degree and outputs that value.</text><!--cluster tempProcessing--><g class="cluster" data-qualified-name="tempProcessing" id="ent0004" data-source-line="24"><rect x="87" y="291" width="176" height="172" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="243" y="296" width="15" height="10" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="241" y="298" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="241" y="302" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="150.85" y="314.8889" fill="#000000" font-size="14" lengthAdjust="spacing" textLength="48.3" font-style="italic" font-family="sans-serif">«block»</text><text x="100.3188" y="328.8889" fill="#000000" font-size="14" lengthAdjust="spacing" textLength="149.3625" font-weight="700" font-family="sans-serif">Temperature Processing</text></g><path d="M209.5,810 L209.5,885 L447.5,885 L447.5,820 L437.5,810 L209.5,810" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M437.5,810 L437.5,820 L447.5,820 L437.5,810" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="215.5" y="825.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="163.8813" font-family="sans-serif">6Gets as input a temperature in</text><text x="215.5" y="838.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="200.85" font-family="sans-serif">degree Celsius or Fahrenheit, or both.</text><text x="215.5" y="851.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="185.6563" font-family="sans-serif">Displays both temperature values.</text><text x="215.5" y="864.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="217.425" font-family="sans-serif">Calls the tempConverter for conversion if</text><text x="215.5" y="877.1111" fill="#000000" font-size="13" lengthAdjust="spacing" textLength="162.7438" font-family="sans-serif">only one value is given as input.</text><!--cluster displayTemp--><g class="cluster" data-qualified-name="displayTemp" id="ent0008" data-source-line="43"><rect x="102" y="627" width="453" height="166" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="535" y="632" width="15" height="10" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="533" y="634" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="533" y="638" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="304.35" y="650.8889" fill="#000000" font-size="14" lengthAdjust="spacing" textLength="48.3" font-style="italic" font-family="sans-serif">«block»</text><text x="288.775" y="664.8889" fill="#000000" font-size="14" lengthAdjust="spacing" textLength="79.45" font-weight="700" font-family="sans-serif">displayTemp</text></g><!--cluster internals--><g class="cluster" data-qualified-name="displayTemp.internals" id="ent0012" data-source-line="54"><rect x="118" y="700" width="243" height="77" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="213.0313" y="712.8889" fill="#000000" font-size="14" lengthAdjust="spacing" textLength="52.9375" font-weight="700" font-family="sans-serif">internals</text></g><g class="entity" data-qualified-name="tempSensor.tempSensor_TVs" id="ent0002" data-source-line="8"><path d="M50.48,46 L50.48,95 L209.5238,9