<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:569px;height:900px;background:#FFFFFF;" width="569px" height="900px" viewBox="0 0 569 900" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml $version$?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><path d="M6,196 L6,232 L257,232 L257,206 L247,196 L6,196" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M247,196 L247,206 L257,206 L247,196" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="211.111" fill="#000" font-size="13" textLength="230.263">2Measure the temperature and outputs it as</text><text x="12" y="224.111" fill="#000" font-size="13" textLength="158.356">raw, unfiltered value in Kelvin.</text><!--cluster tempSensor--><g class="cluster" data-qualified-name="tempSensor" id="ent0001" data-source-line="6"><rect x="42" y="7" width="176" height="146" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="198" y="12" width="15" height="10" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="196" y="14" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="196" y="18" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="105.85" y="30.889" fill="#000" font-size="14" textLength="48.3" font-style="italic">«block»</text><text x="67.788" y="44.889" fill="#000" font-size="14" textLength="124.425" font-weight="700">Temperature Sensor</text></g><path d="M55,506 L55,568 L296,568 L296,516 L286,506 L55,506" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M286,506 L286,516 L296,516 L286,506" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="61" y="521.111" fill="#000" font-size="13" textLength="220.35">4Takes the given raw temperature values</text><text x="61" y="534.111" fill="#000" font-size="13" textLength="193.05">in Kelvin, puts a moving average with</text><text x="61" y="547.111" fill="#000" font-size="13" textLength="211.088">configurable window size on it, converts</text><text x="61" y="560.111" fill="#000" font-size="13" textLength="178.344">it to degree and outputs that value.</text><!--cluster tempProcessing--><g class="cluster" data-qualified-name="tempProcessing" id="ent0004" data-source-line="24"><rect x="87" y="291" width="176" height="172" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="243" y="296" width="15" height="10" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="241" y="298" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="241" y="302" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="150.85" y="314.889" fill="#000" font-size="14" textLength="48.3" font-style="italic">«block»</text><text x="100.319" y="328.889" fill="#000" font-size="14" textLength="149.363" font-weight="700">Temperature Processing</text></g><path d="M209.5,810 L209.5,885 L447.5,885 L447.5,820 L437.5,810 L209.5,810" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M437.5,810 L437.5,820 L447.5,820 L437.5,810" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="215.5" y="825.111" fill="#000" font-size="13" textLength="163.881">6Gets as input a temperature in</text><text x="215.5" y="838.111" fill="#000" font-size="13" textLength="200.85">degree Celsius or Fahrenheit, or both.</text><text x="215.5" y="851.111" fill="#000" font-size="13" textLength="185.656">Displays both temperature values.</text><text x="215.5" y="864.111" fill="#000" font-size="13" textLength="217.425">Calls the tempConverter for conversion if</text><text x="215.5" y="877.111" fill="#000" font-size="13" textLength="162.744">only one value is given as input.</text><!--cluster displayTemp--><g class="cluster" data-qualified-name="displayTemp" id="ent0008" data-source-line="43"><rect x="102" y="627" width="453" height="166" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><rect x="535" y="632" width="15" height="10" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="533" y="634" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><rect x="533" y="638" width="4" height="2" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="304.35" y="650.889" fill="#000" font-size="14" textLength="48.3" font-style="italic">«block»</text><text x="288.775" y="664.889" fill="#000" font-size="14" textLength="79.45" font-weight="700">displayTemp</text></g><!--cluster internals--><g class="cluster" data-qualified-name="displayTemp.internals" id="ent0012" data-source-line="54"><rect x="118" y="700" width="243" height="77" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="213.031" y="712.889" fill="#000" font-size="14" textLength="52.938" font-weight="700">internals</text></g><g class="entity" data-qualified-name="tempSensor.tempSensor_TVs" id="ent0002" data-source-line="8"><path d="M50.48,46 L50.48,95 L209.524,95 L209.524,56 L199.524,46 L50.48,46" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M199.524,46 L199.524,56 L209.524,56 L199.524,46" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="56.48" y="61.111" fill="#000" font-size="13" textLength="138.044">1some tagged value table</text><text x="56.48" y="74.111" fill="#000" font-size="13" textLength="74.506">would be here</text><text x="56.48" y="87.111" fill="#000" font-size="13" textLength="44.119">usually.</text></g><g class="entity" data-qualified-name="tempSensor.tempSensor_temp_dK_raw" id="ent0003" data-source-line="13"><text x="81.149" y="169.889" fill="#000" font-size="14" textLength="86.363">temp_dK_raw</text><rect x="118.33" y="147" width="12" height="12" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/></g><g class="entity" data-qualified-name="tempProcessing.tempProcessing_TVs" id="ent0005" da