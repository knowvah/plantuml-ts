<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" style="width:518px;height:842px;background:#FFFFFF;" width="518px" height="842px" viewBox="0 0 518 842" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml $version$?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="5" y="14.333" fill="#000" font-size="12" textLength="507.6">+=======================================================================</text><text x="5" y="26.333" fill="#000" font-size="12">|</text><text x="5" y="38.333" fill="#000" font-size="12" textLength="246.075">|      PlantUML : a free UML diagram generator</text><text x="5" y="50.333" fill="#000" font-size="12">|</text><text x="5" y="62.333" fill="#000" font-size="12" textLength="507.6">+=======================================================================</text><text x="5" y="74.333" fill="#000" font-size="12"> </text><text x="5" y="86.333" fill="#000" font-size="12" textLength="222">(C) Copyright 2009-2024, Arnaud Roques</text><text x="5" y="98.333" fill="#000" font-size="12"> </text><text x="5" y="110.333" fill="#000" font-size="12" textLength="177.675">Project Info:  https://plantuml.com</text><text x="5" y="122.333" fill="#000" font-size="12"> </text><text x="5" y="134.333" fill="#000" font-size="12" textLength="349.5">If you like this project or if you find it useful, you can support us at:</text><text x="5" y="146.333" fill="#000" font-size="12"> </text><text x="5" y="158.333" fill="#000" font-size="12" textLength="261.6">https://plantuml.com/patreon (only 1$ per month!)</text><text x="5" y="170.333" fill="#000" font-size="12" textLength="269.7">https://plantuml.com/liberapay (only 1€ per month!)</text><text x="5" y="182.333" fill="#000" font-size="12" textLength="145.875">https://plantuml.com/paypal</text><image width="99" height="99" x="31.4" y="185" xlink:href="data:image/png;base64,"/><image width="99" height="99" x="183.2" y="185" xlink:href="data:image/png;base64,"/><image width="99" height="99" x="335" y="185" xlink:href="data:image/png;base64,"/><text x="5" y="293.333" fill="#000" font-size="12" textLength="342.975">PlantUML is free software; you can redistribute it and/or modify it</text><text x="5" y="305.333" fill="#000" font-size="12" textLength="360.525">under the terms of the GNU General Public License as published by</text><text x="5" y="317.333" fill="#000" font-size="12" textLength="342.375">the Free Software Foundation, either version 3 of the License, or</text><text x="5" y="329.333" fill="#000" font-size="12" textLength="175.125">(at your option) any later version.</text><text x="5" y="341.333" fill="#000" font-size="12"> </text><text x="5" y="353.333" fill="#000" font-size="12" textLength="301.875">PlantUML distributed in the hope that it will be useful, but</text><text x="5" y="365.333" fill="#000" font-size="12" textLength="470.25">WITHOUT ANY WARRANTY; without even the implied warranty of MERCHANTABILITY</text><text x="5" y="377.333" fill="#000" font-size="12" textLength="406.275">or FITNESS FOR A PARTICULAR PURPOSE. See the GNU General Public</text><text x="5" y="389.333" fill="#000" font-size="12" textLength="130.575">License for more details.</text><text x="5" y="401.333" fill="#000" font-size="12"> </text><text x="5" y="413.333" fill="#000" font-size="12" textLength="366.675">You should have received a copy of the GNU General Public License</text><text x="5" y="425.333" fill="#000" font-size="12" textLength="351.075">along with this library.  If not, see &lt;https://www.gnu.org/licenses/>.</text><text x="5" y="437.333" fill="#000" font-size="12"> </text><text x="5" y="449.333" fill="#000" font-size="12" textLength="417.45">PlantUML can occasionally display sponsored or advertising messages. Those</text><text x="5" y="461.333" fill="#000" font-size="12" textLength="398.475">messages are usually generated on welcome or error images and never on</text><text x="5" y="473.333" fill="#000" font-size="12" textLength="107.325">functional diagrams.</text><text x="5" y="485.333" fill="#000" font-size="12" textLength="346.95">See https://plantuml.com/professional if you want to remove them</text><text x="5" y="497.333" fill="#000" font-size="12"> </text><text x="5" y="509.333" fill="#000" font-size="12" textLength="444.15">Images (whatever their format : PNG, SVG, EPS...) generated by running PlantUML</text><text x="5" y="521.333" fill="#000" font-size="12" textLength="392.25">are owned by the author of their corresponding sources code (that is, their</text><text x="5" y="533.333" fill="#000" font-size="12" textLength="406.575">textual description in PlantUML language). Those images are not covered by</text><text x="5" y="545.333" fill="#000" font-size="12" textLength="90">this GPL license.</text><text x="5" y="557.333" fill="#000" font-size="12"> </text><text x="5" y="569.333" fill="#000" font-size="12" textLength="437.7">The generated images can then be used without any reference to the GPL license.</text><text x="5" y="581.333" fill="#000" font-size="12" textLength="436.95">It is not even necessary to stipulate that they have been generated with PlantUML,</text><text x="5" y="593.333" fill="#000" font-size="12" textLength="295.95">although this will be appreciated by the PlantUML team.</text><text x="5" y="605.333" fill="#000" font-size="12"> </text><text x="5" y="617.333" fill="#000" font-size="12" textLength="455.25">There is an exception : if the textual description in PlantUML language is also covered</text><text x="5" y="629.333" fill="#000" font-size="12" textLength="337.95">by any license, then the generated images are logically covered</text><text x="5" y="641.333" fill="#000" font-size="12" textLength="135.225">by the very same license.</text><text x="5" y="653.333" fill="#000" font-size="12"> </text><text x="5" y="665.333" fill="#000" font-size="12" textLength="407.925">This distribution bundles a minimal set of GraphViz files and may install them</text><text x="8.3" y="677.333" fill="#000" font-size="12" textLength="219.825">if needed in the local temporary directory.</text><text x="5" y="689.333" fill="#000" font-size="12" textLength="210.375">(see https://plantuml.com/graphviz-dot )</text><text x="5" y="701.333" fill="#000" font-size="12"> </text><text x="5" y="713.333" fill="#000" font-size="12" textLength="313.05">Icons provided by OpenIconic :  https://useiconic.com/open</text><text x="5" y="725.333" fill="#000" font-size="12" textLength="359.025">Archimate sprites provided by Archi :  http://www.archimatetool.com</text><text x="5" y="737.333" fill="#000" font-size="12" textLength="410.625">Stdlib AWS provided by https://github.com/milo-minderbinder/AWS-PlantUML</text><text x="5" y="749.333" fill="#000" font-size="12" textLength="391.05">Stdlib Icons provided https://github.com/tupadr3/plantuml-icon-font-sprites</text><text x="5" y="761.333" fill="#000" font-size="12" textLength="338.85">ASCIIMathML (c) Peter Jipsen http://www.chapman.edu/~jipsen</text><text x="5" y="773.333" fill="#000" font-size="12" textLength="364.5">ASCIIMathML (c) David Lippman http://www.pierce.ctc.edu/dlippman</text><text x="5" y="785.333" fill="#000" font-size="12" textLength="458.7">CafeUndZopfli ported by Eugene Klyuchnikov https://github.com/eustas/CafeUndZopfli</text><text x="5" y="797.333" fill="#000" font-size="12" textLength="322.35">Brotli (c) by the Brotli Authors https://github.com/google/brotli</text><text x="5" y="809.333" fill="#000" font-size="12" textLength="378.9">Themes (c) by Brett Schwarz https://github.com/bschwarz/puml-themes</text><text x="5" y="821.333" fill="#000" font-size="12" textLength="274.95">Twemoji (c) by Twitter at https://twemoji.twitter.com/</text><text x="5" y="833.333" fill="#000" font-size="12"> </text><?plantuml-src oybCJiqhJWK0?></g></svg>